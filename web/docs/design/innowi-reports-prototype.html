<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innowi Super App · Reports prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F8}
*{box-sizing:border-box}
a{color:#444CE7}a:hover{color:#3538CD}
.card{background:#FFFFFF;border:1px solid #E7E9EE;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn{font-family:inherit;font-size:13px;font-weight:600;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #D0D5DD;background:#FFFFFF;color:#344054;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:#F9FAFB;color:#101828}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:#444CE7;border-color:#444CE7;color:#FFFFFF}
.btn-p:hover{background:#3538CD;color:#FFFFFF}
.btn-o{background:#F26B21;border-color:#F26B21;color:#17213A}
.btn-o:hover{background:#FF7E36;color:#17213A}
.btn-s{min-height:32px;font-size:12px;padding:0 10px}
.sel{font-family:inherit;font-size:13px;font-weight:500;min-height:36px;padding:0 8px;border:1px solid #D0D5DD;border-radius:8px;background:#FFFFFF;color:#101828;min-width:150px;max-width:100%}
.inp{font-family:inherit;font-size:13px;min-height:36px;padding:0 10px 0 34px;border:1px solid #D0D5DD;border-radius:8px;background:#FFFFFF;color:#101828;width:100%}
.srch{position:relative;display:flex;align-items:center}
.srch svg{position:absolute;left:10px;pointer-events:none;color:#667085}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:#475467;text-transform:uppercase;letter-spacing:.04em}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#344054;min-height:36px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:#444CE7}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:18px}
.dot{width:7px;height:7px;border-radius:999px;flex:0 0 7px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:18px}
.tag{font-size:10px;font-weight:600;color:#475467;background:#F9FAFB;border:1px solid #E7E9EE;border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:16px}
.tn{font-variant-numeric:tabular-nums}
.th{font-size:11px;font-weight:600;color:#5B6478;padding:10px 12px;border-bottom:1px solid #E7E9EE;background:#F8F9FB;text-transform:uppercase;letter-spacing:.05em;white-space:normal;line-height:1.3;display:flex;align-items:flex-end}
.td{font-size:13px;padding:10px 12px;border-bottom:1px solid #F0F1F4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.4;background:#FFFFFF}
.trow:hover .td{background:#FAFBFC}
.stick{position:sticky;left:0;z-index:1;box-shadow:inset -1px 0 0 #E7E9EE}
.th-btn{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;line-height:inherit;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;gap:4px;align-items:flex-end;width:100%;white-space:normal;overflow-wrap:normal;word-break:normal;text-align:inherit}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mcard{border:1px solid #E7E9EE;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;background:#FFFFFF}
.h2{margin:0;font-size:16px;line-height:1.35;font-weight:600;color:#101828}
.h3{margin:0;font-size:14px;line-height:1.4;font-weight:600;color:#101828}
.over{font-size:11px;font-weight:600;color:#667085;text-transform:uppercase;letter-spacing:.06em}
.muted{color:#475467}
.ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #E7E9EE;flex-wrap:wrap}
.tab{font-family:inherit;font-size:13px;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;margin-bottom:-1px;cursor:pointer;color:#475467}
.tab:hover{color:#101828}
.seg{display:inline-flex;border:1px solid #D0D5DD;border-radius:8px;overflow:hidden}
.seg button{white-space:nowrap;font-family:inherit;font-size:13px;font-weight:600;border:0;background:#FFFFFF;color:#344054;padding:0 12px;min-height:34px;cursor:pointer;border-right:1px solid #D0D5DD}
.seg button:last-child{border-right:0}
:focus-visible{outline:2px solid #444CE7;outline-offset:2px}
.sb{flex:0 0 248px;width:248px;max-width:100%;background:#17213A;color:#FFFFFF;display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:38px;height:38px;border-radius:9px;background:#F26B21;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;letter-spacing:-0.03em;flex:0 0 38px}
.sb-label{font-size:11px;font-weight:500;color:#8C99B5;text-transform:uppercase;letter-spacing:.1em;padding:0 12px}
.sb-list{display:flex;flex-direction:column;gap:6px;padding:18px 12px;overflow-y:auto}
.sb-item{position:relative;width:100%;display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit;font-size:14px;min-height:40px;padding:0 12px;border-radius:8px;border:0;cursor:pointer}
.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-ind{position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.sb-badge{font-size:11px;font-weight:700;color:#FFFFFF;padding:0 8px;border-radius:999px;line-height:18px;font-variant-numeric:tabular-nums}
.sb-menu{display:none;margin-left:auto;font-family:inherit;font-size:13px;font-weight:600;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#FFFFFF;cursor:pointer;align-items:center;gap:6px}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:#FFFFFF;border:1px solid #E7E9EE;border-radius:10px;box-shadow:0 12px 28px rgba(16,24,40,.14);padding:8px;min-width:220px;max-height:340px;overflow:auto}
.opt{width:100%;display:flex;align-items:center;gap:10px;text-align:left;font-family:inherit;font-size:13px;color:#101828;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer}
.opt:hover{background:#F5F6F8}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.38);border:0;cursor:pointer;width:100%;height:100%}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(560px, 100%);background:#FFFFFF;box-shadow:-12px 0 32px rgba(16,24,40,.18);display:flex;flex-direction:column;overflow:hidden}
@media (min-width: 821px){
  .sb{position:sticky;top:0;height:100vh;align-self:flex-start}
}
@media (max-width: 820px){
  .sb{flex:1 1 100%;width:100%}
  .sb-menu{display:inline-flex}
  .sb-collapse{display:none}
  .sb-collapse.open{display:flex}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height:100vh; display:flex; flex-wrap:wrap; align-items:stretch; background:#F5F6F8; color:#101828; font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size:14px">

  <aside class="sb" aria-label="Innowi navigation">
    <div class="sb-brand">
      <div class="sb-logo" aria-hidden="true">in</div>
      <div style="display:flex; flex-direction:column; gap:2px; line-height:1.2; min-width:0">
        <span style="font-weight:700; font-size:17px; color:#FFFFFF; letter-spacing:-0.01em">innowi</span>
        <span style="font-size:11px; color:#8C99B5; text-transform:uppercase; letter-spacing:.12em">Reports Hub</span>
      </div>
      <button type="button" class="sb-menu" onClick="{{toggleMenu}}" aria-expanded="{{menuOpenAttr}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>Menu
      </button>
    </div>
    <div class="sb-collapse {{menuCls}}" style="flex-direction:column; flex:1 1 auto; min-height:0">
      <nav aria-label="Main" class="sb-list">
        <span class="sb-label" style="margin-bottom:4px">Workspace</span>
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
          <button type="button" class="sb-item" onClick="{{n.go}}" aria-current="{{n.current}}" style="background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}">
            <span class="sb-ind" aria-hidden="true" style="background: {{n.ind}}"></span>
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 19px"><path d="{{n.icon}}"></path></svg>
            <span style="flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{n.label}}</span>
            <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="sb-badge" style="background: {{n.badgeBg}}" aria-label="{{n.badgeLabel}}">{{n.badge}}</span></sc-if>
          </button>
        </sc-for>
      </nav>
      <div style="margin-top:auto; padding:16px 20px 20px; border-top:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:3px">
        <span style="font-size:13px; font-weight:700; color:#E4E9F2">Internal tool</span>
        <span style="font-size:12px; color:#8C99B5">Prototype · sample data · v1.1</span>
      </div>
    </div>
  </aside>

  <main style="flex:1 1 560px; min-width:0; padding:20px clamp(14px, 2.4vw, 28px) 48px; display:flex; flex-direction:column; gap:16px">
    <header style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid #E7E9EE">
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0; flex:1 1 300px">
        <h1 style="margin:0; font-size:20px; line-height:1.3; font-weight:700; letter-spacing:-0.01em; color:#101828">{{pageTitle}}</h1>
        <div style="font-size:13px; color:#5B6478; line-height:1.45">{{pageSub}}</div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center">
        <label class="lbl" style="flex-direction:row; align-items:center; gap:8px">Period
          <select class="sel" value="{{monthIdx}}" onChange="{{onMonth}}">
            <option value="0">September 2026</option>
            <option value="1">August 2026</option>
            <option value="2">July 2026</option>
          </select>
        </label>
        <label class="lbl" style="flex-direction:row; align-items:center; gap:8px">Release
          <select class="sel" value="{{phase}}" onChange="{{onPhase}}" style="min-width:130px">
            <option value="all">Phase 1 and 2</option>
            <option value="p1">Phase 1 only</option>
          </select>
        </label>
      </div>
    </header>
<!-- ============ OVERVIEW ============ -->
    <sc-if value="{{isOverview}}" hint-placeholder-val="{{true}}">
      <div style="display:flex; flex-direction:column; gap:16px">
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px">
          <sc-for list="{{ov.kpis}}" as="t" hint-placeholder-count="4">
            <div class="card" style="padding:16px; display:flex; flex-direction:column; gap:12px">
              <div style="display:flex; justify-content:space-between; gap:8px; align-items:center">
                <div style="display:flex; gap:10px; align-items:center">
                  <span class="ico" style="background: {{t.tint}}; color: {{t.ink}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span>
                  <span style="font-size:14px; font-weight:500; color:#475467">{{t.label}}</span>
                </div>
                <span class="tag">{{t.id}}</span>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px">
                <span class="tn" style="font-size:24px; font-weight:600; line-height:1.15; letter-spacing:-0.02em; white-space:nowrap">{{t.value}}</span>
                <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:#475467; white-space:nowrap"><span class="pill" style="background: {{t.pillBg}}; color: {{t.pillFg}}">{{t.chg}}</span>vs {{prevMonth}}</span>
              </div>
              <svg aria-hidden="true" viewBox="0 0 100 28" preserveAspectRatio="none" style="width:100%; height:44px"><polygon points="{{t.area}}" fill="#444CE7" opacity="0.08"></polygon><polyline points="{{t.line}}" fill="none" stroke="#444CE7" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline></svg>
            </div>
          </sc-for>
        </div>

        <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:stretch">
          <section class="card" aria-label="Report pipeline" style="flex:1 1 380px; min-width:0; padding:16px; display:flex; flex-direction:column; gap:18px">
            <div style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:center">
              <div style="display:flex; flex-direction:column; gap:2px">
                <h2 class="h3">Report pipeline</h2>
                <span style="font-size:13px; color:#475467">{{monthLabel}} · {{ov.total}} merchant reports</span>
              </div>
              <button type="button" class="btn btn-s" onClick="{{goQueue}}">Open queue</button>
            </div>
            <div role="img" aria-label="{{ov.barLabel}}" style="display:flex; height:12px; border-radius:999px; overflow:hidden; background:#F2F4F7; gap:2px">
              <sc-for list="{{ov.segs}}" as="s" hint-placeholder-count="5"><div style="height:100%; width: {{s.w}}; background: {{s.bg}}"></div></sc-for>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:8px 16px">
              <sc-for list="{{ov.statuses}}" as="s" hint-placeholder-count="6">
                <span style="display:flex; align-items:center; gap:6px; font-size:13px; color:#344054"><span class="dot" style="background: {{s.dot}}"></span>{{s.t}} <strong class="tn">{{s.n}}</strong></span>
              </sc-for>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; padding-top:16px; border-top:1px solid #F2F4F7">
              <sc-for list="{{ov.mini}}" as="t" hint-placeholder-count="3">
                <div style="display:flex; flex-direction:column; gap:2px">
                  <span style="font-size:12px; color:#475467">{{t.label}} <span class="tag">{{t.id}}</span></span>
                  <span class="tn" style="font-size:16px; font-weight:600; color: {{t.c}}">{{t.value}}</span>
                </div>
              </sc-for>
            </div>
          </section>
          <section class="card" aria-label="Portfolio gross sales trend" style="flex:1.4 1 420px; min-width:0; padding:16px; display:flex; flex-direction:column; gap:14px">
            <div style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:center">
              <div style="display:flex; flex-direction:column; gap:2px">
                <h2 class="h3">Portfolio gross sales</h2>
                <span style="font-size:13px; color:#475467">Six months to {{monthLabel}} · merchants with a connected sales feed</span>
              </div>
              <span class="tag">SAL-18</span>
            </div>
            <div role="img" aria-label="Portfolio gross sales by month" style="display:flex; align-items:flex-end; gap:12px; height:150px; padding-top:20px">
              <sc-for list="{{ov.trend}}" as="b" hint-placeholder-count="6">
                <div style="flex:1 1 0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; min-width:0">
                  <span class="tn" style="font-size:11px; font-weight:600; color: {{b.fg}}">{{b.v}}</span>
                  <div style="width:100%; max-width:56px; border-radius:6px 6px 2px 2px; height: {{b.h}}; background: {{b.bg}}"></div>
                  <span style="font-size:12px; color:#475467">{{b.lbl}}</span>
                </div>
              </sc-for>
            </div>
          </section>
        </div>

        <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start">
          <section class="card" aria-label="Needs attention" style="flex:1 1 340px; min-width:0; padding:16px; display:flex; flex-direction:column; gap:4px">
            <div style="display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:8px">
              <h2 class="h3">Needs attention</h2>
              <button type="button" class="btn btn-s" onClick="{{goAttention}}">View all</button>
            </div>
            <sc-for list="{{ov.risks}}" as="r" hint-placeholder-count="5">
              <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid #F2F4F7">
                <span class="ico" style="width:32px; height:32px; flex:0 0 32px; border-radius:999px; background: {{r.bg}}; color: {{r.c}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg></span>
                <div style="display:flex; flex-direction:column; gap:2px; min-width:0; flex:1">
                  <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center"><span style="font-size:14px; font-weight:600">{{r.m}}</span><span class="pill" style="background: {{r.bg}}; color: {{r.c}}">{{r.sev}}</span></div>
                  <span style="font-size:13px; color:#344054; line-height:1.45">{{r.t}}</span>
                  <span style="font-size:12px; color:#475467">{{r.owner}} · {{r.id}}</span>
                </div>
              </div>
            </sc-for>
          </section>
          <section class="card" aria-label="Portfolio roll-up" style="flex:2 1 560px; min-width:0; padding:16px; display:flex; flex-direction:column; gap:14px">
            <div style="display:flex; justify-content:space-between; gap:8px; align-items:center">
              <div style="display:flex; flex-direction:column; gap:2px">
                <h2 class="h3">Top restaurants</h2>
                <span style="font-size:13px; color:#475467">Top 8 restaurants by gross sales, {{monthLabel}}</span>
              </div>
              <span class="tag">REP-11</span>
            </div>
            <div style="overflow-x:auto; border:1px solid #EAECF0; border-radius:10px">
              <div role="table" aria-label="Portfolio roll-up" style="min-width: {{ov.tb.minW}}px">
                <div role="row" style="display:grid; grid-template-columns: {{ov.tb.gridCols}}">
                  <sc-for list="{{ov.tb.cols}}" as="h" hint-placeholder-count="8"><div role="columnheader" class="th">{{h.t}}</div></sc-for>
                </div>
                <sc-for list="{{ov.tb.rows}}" as="rw" hint-placeholder-count="8">
                  <div role="row" class="trow" style="display:grid; grid-template-columns: {{ov.tb.gridCols}}">
                    <sc-for list="{{rw.cells}}" as="cl" hint-placeholder-count="8"><div role="cell" class="td" style="font-weight: {{cl.w}}; color: {{cl.c}}">{{cl.t}}</div></sc-for>
                  </div>
                </sc-for>
              </div>
            </div>
            <span style="font-size:12px; color:#475467">Totals leave out sources that are not supplied. Ad return counts only accounts with conversion tracking.</span>
          </section>
        </div>
      </div>
    </sc-if>

    <!-- ============ NEEDS ATTENTION ============ -->
    <sc-if value="{{isAttention}}" hint-placeholder-val="{{false}}">
      <div style="display:flex; flex-direction:column; gap:14px">
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px">
          <sc-for list="{{att.tiles}}" as="t" hint-placeholder-count="4">
            <div class="card" style="padding:14px; display:flex; gap:12px; align-items:center">
              <span class="ico" style="background: {{t.bg}}; color: {{t.c}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span>
              <div style="display:flex; flex-direction:column; gap:2px">
                <span class="tn" style="font-size:20px; font-weight:600">{{t.value}}</span>
                <span style="font-size:13px; color:#475467">{{t.label}}</span>
              </div>
            </div>
          </sc-for>
        </div>
        <section class="card" aria-label="Risks to act on" style="overflow:hidden">
          <div style="display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 20px; background:#F9FAFB; border-bottom:1px solid #EAECF0" class="over">
            <span style="flex:0 0 40px">#</span>
            <span style="flex:2 1 220px">Merchant and issue</span>
            <span style="flex:1 1 130px">Severity</span>
            <span style="flex:1 1 160px">Owner</span>
            <span style="flex:1 1 150px; text-align:right">Action</span>
          </div>
          <sc-for list="{{att.rows}}" as="r" hint-placeholder-count="8">
            <div class="trow" style="display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding:16px 20px; border-bottom:1px solid #F2F4F7">
              <span class="tn" style="flex:0 0 40px; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; max-width:32px; background: {{r.bg}}; color: {{r.c}}">{{r.rank}}</span>
              <div style="flex:2 1 220px; min-width:0; display:flex; gap:12px; align-items:center">
                <span aria-hidden="true" style="width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:0 0 40px; background: {{r.avBg}}; color: {{r.avFg}}">{{r.initials}}</span>

            <select class="sel" aria-label="Account manager" value="{{rs.am}}" onChange="{{rs.onAm}}">

              <option value="1">Daniel Ortiz</option>
              <option value="2">Maya Wong</option>
              <option value="3">Omar Khan</option>
              <option value="4">Sara Lee</option>
            </select>
            <select class="sel" aria-label="Report status" value="{{rs.st}}" onChange="{{rs.onSt}}" style="min-width:130px">

              <option value="due">Due</option>
              <option value="generating">Generating</option>

              <option value="approved">Approved</option>
              <option value="sent">Sent</option>
              <option value="failed">Failed</option>
            </select>
            <select class="sel" aria-label="Module" value="{{rs.mod}}" onChange="{{rs.onMod}}" style="min-width:140px">

              <option value="web">Website</option>
              <option value="gbp">Business Profile</option>

            <div style="position:relative">

                    <button type="button" class="btn btn-s" onClick="{{rs.toggleCols}}">Done</button>
                  </div>
                </div>
              </sc-if>
            </div>
            <button type="button" class="btn" onClick="{{rs.exportCsv}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Export CSV</button>

                    <button type="button" class="th-btn" onClick="{{h.sort}}" style="justify-content: {{h.jc}}; color: {{h.c}}">{{h.l}}<span aria-hidden="true" style="color:#F26B21">{{h.arrow}}</span></button>

              <sc-for list="{{rs.rows}}" as="rw" hint-placeholder-count="10">

                      <sc-if value="{{cl.isStatus}}" hint-placeholder-val="{{false}}"><span class="chip" style="color: {{cl.sc}}; background: {{cl.sbg}}"><span class="dot" style="background: {{cl.sdot}}"></span>{{cl.t}}</span></sc-if>
                      <sc-if value="{{cl.isAm}}" hint-placeholder-val="{{false}}">
                        <span style="display:flex; align-items:center; gap:8px; min-width:0"><span aria-hidden="true" style="width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:10px; flex:0 0 24px; color:#FFFFFF; background: {{cl.avBg}}">{{cl.ini}}</span><span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{cl.t}}</span></span>
                      </sc-if>
                      <sc-if value="{{cl.isAct}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-s" onClick="{{cl.open}}">Details</button></sc-if>

    <!-- ============ DETAILS DRAWER ============ -->
    <sc-if value="{{dt.open}}" hint-placeholder-val="{{false}}">

        <div style="display:flex; gap:12px; align-items:center; padding:16px 18px; border-bottom:1px solid #E7E9EE">
          <span aria-hidden="true" style="width:40px; height:40px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:0 0 40px; color:#FFFFFF; background: {{dt.avBg}}">{{dt.ini}}</span>
          <div style="display:flex; flex-direction:column; gap:2px; min-width:0; flex:1">
            <span style="font-size:16px; font-weight:700">{{dt.name}}</span>
            <span style="font-size:12px; color:#5B6478">{{dt.sub}}</span>
          </div>

            <button type="button" class="btn btn-s" onClick="{{dt.customers}}">View customers</button>
          </div>

            <div style="border:1px solid #E7E9EE; border-radius:10px; overflow:hidden">
              <sc-for list="{{dt.profile}}" as="p" hint-placeholder-count="6">
                <div style="display:flex; justify-content:space-between; gap:12px; padding:8px 12px; border-bottom:1px solid #F0F1F4; font-size:13px"><span class="muted">{{p.k}}</span><span style="font-weight:600; text-align:right">{{p.v}}</span></div>
              </sc-for>

            <span class="over">Service package</span>
            <div style="display:flex; flex-wrap:wrap; gap:5px">
              <sc-for list="{{dt.pkg}}" as="p" hint-placeholder-count="6"><span class="chip" style="color: {{p.c}}; background: {{p.bg}}; text-decoration: {{p.dec}}">{{p.t}}</span></sc-for>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px">
            <span class="over">{{dt.monthLabel}} at a glance</span>

              <sc-for list="{{dt.kpis}}" as="c" hint-placeholder-count="8">

                  <span style="font-size:11px; color:#5B6478; font-weight:500">{{c.name}}</span>
                  <span class="tn" style="font-size:16px; font-weight:700; color: {{c.valColor}}">{{c.value}}</span>
                  <span class="pill" style="align-self:flex-start; background: {{c.pillBg}}; color: {{c.pillFg}}">{{c.chgShort}}</span>

                <span style="display:flex; align-items:center; gap:8px; font-size:13px"><span class="dot" style="background: {{s.dot}}"></span><span style="flex:1">{{s.n}}</span><span style="color: {{s.c}}; font-weight:600">{{s.t}}</span></span>
              </sc-for>

          </div>
          <div style="display:flex; flex-direction:column; gap:8px">

    <!-- ============ COMPARE ============ -->

              <h2 class="h3">Restaurants</h2>
              <span class="tn" style="font-size:12px; font-weight:600; color: {{cp.countColor}}">{{cp.countLabel}}</span>
            </div>
            <div class="srch">
              <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"></path></svg>

                  <span style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{o.name}}</span>
                  <span style="font-size:11px; color:#667085">{{o.sub}}</span>
                </span>
              </button>
            </sc-for>
          </div>
        </section>

        <div style="flex:999 1 560px; min-width:0; display:flex; flex-direction:column; gap:14px">
          <section class="card" aria-label="Chart" style="padding:14px 16px; display:flex; flex-direction:column; gap:12px">
            <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between">
              <div style="display:flex; flex-direction:column; gap:2px">

                <span style="font-size:15px; font-weight:700">{{cp.chartName}} <span class="tag">{{cp.chartId}}</span></span>

                <option value="web">Website</option>
                <option value="gbp">Business Profile</option>
                <option value="ads">Ads</option>
                <option value="esm">Email &amp; SMS</option>
                <option value="rwd">Rewards</option>
                <option value="rev">Reviews</option>
                <option value="cust">Customers</option>
              </select>
              <label class="chk"><input type="checkbox" checked="{{cp.hi}}" onChange="{{cp.toggleHi}}"> Highlight best and worst</label>
            </div>
            <div style="overflow:auto; max-height:640px">
              <div role="table" aria-label="Restaurant comparison" style="min-width: {{cp.minW}}px">
                <div role="row" style="display:grid; position:sticky; top:0; z-index:2; grid-template-columns: {{cp.grid}}">
                  <div role="columnheader" class="th stick" style="z-index:3">Metric</div>
                  <sc-for list="{{cp.heads}}" as="h" hint-placeholder-count="6">
                    <div role="columnheader" class="th" style="text-transform:none; letter-spacing:0; display:flex; align-items:center; gap:6px; justify-content:space-between">

                    </div>

                </sc-for>
              </div>
            </div>
            <div style="padding:10px 16px; font-size:12px; color:#667085; border-top:1px solid #F0F1F4">Green is best and red is worst in each row (lower is better for position, cost and refunds). “—” means not in that restaurant’s package; “n/s” means not supplied.</div>
